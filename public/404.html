<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>404 — Casino X</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #0f1923 0%, #16213e 60%, #0f3460 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Arial', sans-serif;
    color: #fff;
    text-align: center;
    padding: 24px;
  }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(240,192,64,0.25);
    border-radius: 20px;
    padding: 56px 48px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }
  .suit { font-size: 72px; margin-bottom: 8px; }
  .code {
    font-size: 96px;
    font-weight: 900;
    color: #f0c040;
    letter-spacing: 6px;
    line-height: 1;
    margin-bottom: 12px;
  }
  .brand {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 6px;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .divider {
    width: 60px;
    height: 2px;
    background: rgba(240,192,64,0.4);
    margin: 0 auto 28px;
    border-radius: 2px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 12px;
    color: #fff;
  }
  p {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
    line-height: 1.7;
    margin-bottom: 36px;
  }
  .btn {
    display: inline-block;
    background: linear-gradient(135deg, #f0c040, #d4a020);
    color: #0f1923;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: none;
    padding: 14px 36px;
    border-radius: 10px;
    transition: opacity 0.2s, transform 0.15s;
  }
  .btn:hover { opacity: 0.88; transform: translateY(-1px); }
</style>
</head>
<body>
  <div class="card">
    <div class="suit">♠</div>
    <div class="code">404</div>
    <div class="brand">Casino X</div>
    <div class="divider"></div>
    <h1>This page folded.</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back to the table.</p>
    <a href="/" class="btn">Back to Casino</a>
  </div>
</body>
</html>
