<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe080"/>
      <stop offset="100%" style="stop-color:#f0c040"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Gold border outline -->
  <rect x="8" y="8" width="496" height="496" rx="90" fill="none" stroke="url(#gold)" stroke-width="10"/>
  <!-- Inner subtle border -->
  <rect x="22" y="22" width="468" height="468" rx="78" fill="none" stroke="rgba(240,192,64,0.2)" stroke-width="3"/>
  <!-- Spade symbol -->
  <text x="256" y="340" font-size="300" font-family="serif" fill="url(#gold)" text-anchor="middle">♠</text>
  <!-- Casino X text -->
  <text x="256" y="440" font-size="52" font-family="Arial Black, Arial, sans-serif" font-weight="900" fill="rgba(255,255,255,0.9)" text-anchor="middle" letter-spacing="6">CASINO X</text>
  <!-- Bottom gold line -->
  <rect x="156" y="452" width="200" height="3" rx="2" fill="url(#gold)" opacity="0.6"/>
</svg>
