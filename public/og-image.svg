<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1923"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe080"/>
      <stop offset="100%" style="stop-color:#f0c040"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Border glow -->
  <rect x="20" y="20" width="1160" height="590" rx="18" fill="none" stroke="rgba(240,192,64,0.25)" stroke-width="2"/>

  <!-- Big spade left -->
  <text x="130" y="400" font-size="320" font-family="serif" fill="rgba(240,192,64,0.07)" text-anchor="middle">♠</text>

  <!-- Big spade right -->
  <text x="1070" y="400" font-size="320" font-family="serif" fill="rgba(240,192,64,0.07)" text-anchor="middle">♠</text>

  <!-- Spade icon -->
  <text x="600" y="220" font-size="90" font-family="serif" fill="url(#gold)" text-anchor="middle">♠</text>

  <!-- Casino X title -->
  <text x="600" y="330" font-size="88" font-family="Arial Black, Arial, sans-serif" font-weight="900" fill="url(#gold)" text-anchor="middle" letter-spacing="8">CASINO X</text>

  <!-- Divider -->
  <rect x="400" y="358" width="400" height="2" rx="1" fill="rgba(240,192,64,0.4)"/>

  <!-- Subtitle -->
  <text x="600" y="415" font-size="28" font-family="Arial, sans-serif" font-weight="600" fill="rgba(255,255,255,0.75)" text-anchor="middle" letter-spacing="4">FREE MULTIPLAYER BLACKJACK &amp; POKER</text>

  <!-- Tag line -->
  <text x="600" y="470" font-size="20" font-family="Arial, sans-serif" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="2">No real money • No downloads • Just play</text>

  <!-- Card suits row -->
  <text x="460" y="550" font-size="32" font-family="serif" fill="rgba(255,255,255,0.15)" text-anchor="middle">♠</text>
  <text x="520" y="550" font-size="32" font-family="serif" fill="rgba(255,255,255,0.15)" text-anchor="middle">♥</text>
  <text x="580" y="550" font-size="32" font-family="serif" fill="rgba(255,255,255,0.15)" text-anchor="middle">♦</text>
  <text x="640" y="550" font-size="32" font-family="serif" fill="rgba(255,255,255,0.15)" text-anchor="middle">♣</text>
  <text x="700" y="550" font-size="32" font-family="serif" fill="rgba(255,255,255,0.15)" text-anchor="middle">♠</text>
</svg>
